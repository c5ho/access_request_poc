steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/access-request-poc:$BUILD_ID', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/access-request-poc:$BUILD_ID']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'access-request-poc'
      - '--image'
      - 'gcr.io/$PROJECT_ID/access-request-poc:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--command=python'
      - '--args=-m,streamlit,run,app.py,--server.port,8080,--server.address,0.0.0.0'

images:
  - 'gcr.io/$PROJECT_ID/access-request-poc:$BUILD_ID'

timeout: '1200s'
