name: CI / Build & Deploy to Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          . .venv/bin/activate || true
          PYTHONPATH=src pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Configure gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
      - name: Build and push image
        run: |
          set -e
          BUILD_ID=$(gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/access-request-poc:latest --async --format="value(id)")
          echo "Submitted build $BUILD_ID"
          # Poll instead of relying on gcloud's log-streaming, which flakes out on this runner.
          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)")
            echo "Build status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for build to finish"
          exit 1
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy access-request-poc \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/access-request-poc:latest \
            --platform managed --region us-central1 --allow-unauthenticated
